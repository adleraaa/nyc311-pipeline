[project]
name = "nyc311-pipeline"
version = "0.1.0"
description = "Incremental ELT of NYC 311 service requests into DuckDB with dbt"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
