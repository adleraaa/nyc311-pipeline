name: Refresh data and deploy dashboard

on:
  schedule:
    # The source publishes its daily update around 01:30 UTC.
    - cron: "30 7 * * *"
  workflow_dispatch:

env:
  DO_NOT_TRACK: "1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      # State (the DuckDB warehouse with its watermark, plus recent landing
      # files) is carried between runs in the Actions cache. On a cache miss
      # the extractor finds no watermark and backfills the whole window.
      - name: Restore warehouse state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: warehouse-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: warehouse-v1-

      - name: Extract and load (incremental)
        run: python -m nyc311 -v extract --window-days 30 --stats-out quality/extract_run.json

      # Also runs when the extract failed part-way: every committed page is
      # stored with its watermark, so the saved file is consistent and the next
      # run resumes after the last committed row instead of redoing the work.
      - name: Save warehouse state
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: data
          key: warehouse-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: dbt build (models + tests)
        run: dbt build --project-dir dbt --profiles-dir dbt

      # Exit 1 = a data check failed: still publish the dashboard (which shows
      # the report) and fail the job at the end. Exit 2 = the check code
      # crashed: that is a bug, so stop here.
      - name: Data-quality checks
        id: quality
        run: |
          set +e
          python -m nyc311 quality --out quality
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then echo "failed=true" >> "$GITHUB_OUTPUT"; elif [ "$rc" -ne 0 ]; then exit "$rc"; fi

      - name: Build dashboard
        run: python -m nyc311 build-site --out _site --quality quality/quality_report.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Fail if a quality check failed
        if: steps.quality.outputs.failed == 'true'
        run: |
          cat quality/quality_report.md
          exit 1
