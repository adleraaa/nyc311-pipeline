name: nyc311
version: "0.1.0"
config-version: 2
profile: nyc311

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

models:
  nyc311:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

vars:
  # agg_resolution_time only ranks requests at least this old (see the model).
  resolution_min_age_days: 14

flags:
  send_anonymous_usage_stats: false
