version: 2

sources:
  - name: raw
    description: Loaded by `python -m nyc311 extract` (idempotent upsert on unique_key).
    tables:
      - name: service_requests
        columns:
          - name: unique_key
            data_tests: [unique, not_null]
          - name: created_date
            data_tests: [not_null]

models:
  - name: stg_service_requests
    description: Typed and cleaned 311 requests, one row per unique_key.
    columns:
      - name: unique_key
        data_tests: [unique, not_null]
      - name: created_at
        data_tests: [not_null]
      - name: complaint_type
        data_tests: [not_null]
      - name: borough
        data_tests:
          - accepted_values:
              arguments:
                values: [MANHATTAN, BROOKLYN, QUEENS, BRONX, STATEN ISLAND, UNSPECIFIED]
      - name: status
        data_tests:
          # Warn rather than fail: a new status label upstream should be looked
          # at, but it should not block the daily refresh.
          - accepted_values:
              arguments:
                values: [Open, Assigned, In Progress, Pending, Started, Closed, Unspecified]
              config:
                severity: warn
