version: 2

models:
  - name: fct_daily_volume
    description: Requests created per day, borough and complaint type.
    columns:
      - name: created_day
        data_tests: [not_null]
      - name: borough
        data_tests: [not_null]
      - name: n_requests
        data_tests: [not_null]

  - name: agg_resolution_time
    description: >
      Resolution hours by agency x complaint type, with an agency rollup ('(all)'), for
      requests created at least resolution_min_age_days before the snapshot. Open requests
      count as unresolved, so median/p90 are NULL when too few requests are closed.
    columns:
      - name: agency
        data_tests: [not_null]
      - name: complaint_type
        data_tests: [not_null]
      - name: n_requests
        data_tests: [not_null]
      - name: share_open
        data_tests: [not_null]

  - name: agg_open_backlog_aging
    description: Open requests by agency, complaint type and age bucket.
    columns:
      - name: age_bucket
        data_tests:
          - accepted_values:
              arguments:
                values: ["<1d", "1-3d", "3-7d", "7-14d", "14-30d", "30d+"]
      - name: n_open
        data_tests: [not_null]
